name: Refresh Zwift TTT data

# Run manually: Actions tab > "Refresh Zwift TTT data" > Run workflow

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install openpyxl

      - name: Download the workbook from Dropbox
        env:
          DROPBOX_URL: ${{ secrets.DROPBOX_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.parse
          import zipfile

          url = os.environ.get("DROPBOX_URL", "").strip()

          if not url:
              sys.exit("The DROPBOX_URL GitHub secret is empty.")

          # Convert a standard Dropbox sharing link into a direct-download link.
          # This works with links ending in ?dl=0 or ?dl=1.
          parts = urllib.parse.urlsplit(url)
          if parts.scheme not in ("http", "https") or "dropbox.com" not in parts.netloc.lower():
              sys.exit("DROPBOX_URL must be a valid Dropbox shared-file URL.")

          query = urllib.parse.parse_qs(parts.query, keep_blank_values=True)
          query["dl"] = ["1"]
          download_url = urllib.parse.urlunsplit((
              parts.scheme,
              parts.netloc,
              parts.path,
              urllib.parse.urlencode(query, doseq=True),
              parts.fragment
          ))

          request = urllib.request.Request(
              download_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
                  content_type = response.headers.get("Content-Type", "")
          except Exception as exc:
              sys.exit(f"Could not download the Dropbox workbook: {type(exc).__name__}: {exc}")

          # Excel .xlsm files are ZIP containers and start with the ZIP signature.
          output_path = "/tmp/src.xlsm"
          with open(output_path, "wb") as file:
              file.write(data)

          if len(data) < 100_000 or not zipfile.is_zipfile(output_path):
              os.remove(output_path)
              sys.exit(
                  "Dropbox did not return a valid Excel workbook. "
                  f"Received {len(data)} bytes (content type: {content_type or 'unknown'}). "
                  "Check that the Dropbox link is for the file and that "
                  "'Anyone with the link' can view it."
              )

          print(f"Downloaded valid Excel workbook ({len(data):,} bytes).")
          PY

      - name: Keep only the TTT Archive tab
        run: |
          python - <<'PY'
          import sys
          from openpyxl import load_workbook, Workbook

          KEEP = list(range(0, 13)) + [28, 29]  # A:M and AC:AD

          src = load_workbook("/tmp/src.xlsm", data_only=True, read_only=True)

          if "TTT Archive" not in src.sheetnames:
              sys.exit("No sheet called 'TTT Archive' in the workbook.")

          out = Workbook()
          ws = out.active
          ws.title = "TTT Archive"

          n = 0

          for row in src["TTT Archive"].iter_rows(values_only=True):
              row = list(row) + [None] * (30 - len(row))
              new = [row[i] if i in KEEP else None for i in range(30)]

              if any(v is not None for v in new):
                  ws.append(new)
                  n += 1

          if n < 1000:
              sys.exit(f"Only {n} rows found - refusing to publish.")

          out.save("Zwift_TTT.xlsx")
          print("Wrote", n, "rows")
          PY

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Zwift_TTT.xlsx

          if git diff --cached --quiet; then
            echo "No changes - the data is already up to date."
          else
            git commit -m "Refresh Zwift TTT data from Dropbox"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
