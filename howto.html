<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>How to use the TTT history dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff4;--card:#fff;--ink:#0f1b2d;--mut:#5b6677;--line:#d8dee8;--acc:#1f4fff;--hd:#0f1b2d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121d;--card:#142033;--ink:#e8edf5;--mut:#98a4b8;--line:#25324a;--acc:#6f95ff;--hd:#050a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b121d;--card:#142033;--ink:#e8edf5;--mut:#98a4b8;--line:#25324a;--acc:#6f95ff;--hd:#050a12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.hero{background:var(--hd);color:#fff;padding:36px 20px 28px;text-align:center}
h1{font:700 44px/1 'Barlow Condensed',Impact,sans-serif;margin:0 0 8px}.hero p{color:#9fb0cc;margin:0 auto 18px;max-width:620px}
.toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.toc a{color:#fff;text-decoration:none;border:1px solid #3a4a66;border-radius:20px;padding:5px 14px;font-weight:500;font-size:13px}.toc a:hover{background:#1f4fff}
.wrap{max-width:1040px;margin:auto;padding:10px 20px 50px}
.sec{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start;padding:34px 0;border-bottom:1px solid var(--line)}
@media(max-width:820px){.sec{grid-template-columns:1fr}}
h2{font:700 32px/1.05 'Barlow Condensed',Impact,sans-serif;margin:0 0 6px}.lead{color:var(--mut);margin:0 0 14px}
ol{list-style:none;margin:0;padding:0}li{margin:0 0 10px;padding-left:0}
.b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e0702f;color:#fff;font:700 11px Inter;font-style:normal;margin-right:7px;vertical-align:middle}
.m{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;font-size:11px;box-shadow:0 6px 24px #0f1b2d18}
.mh{background:var(--hd);color:#fff;padding:9px 11px 0}.mh b{font:700 15px 'Barlow Condensed',Impact,sans-serif;letter-spacing:.2px}
.mt{display:flex;gap:2px;margin-top:6px;overflow:hidden}.mt span{padding:5px 9px;color:#9fb0cc;border-bottom:2px solid transparent;white-space:nowrap}.mt .on{color:#fff;border-color:#5b8cff}
.fl{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.pill{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.mb{padding:10px;display:grid;gap:8px}.mc{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px;overflow:hidden}.mc h4{margin:0 0 5px;font-size:11px}
.mk{display:flex;gap:6px}.mk div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 7px}.mk b{display:block;font:700 17px/1.1 'Barlow Condensed',sans-serif;color:var(--acc)}.mk small{color:var(--mut);font-size:9px}
.t{width:100%;border-collapse:collapse}.t th{text-align:left;border-bottom:1px solid var(--line);padding:3px 4px;white-space:nowrap}.t td{padding:3px 4px;border-bottom:1px solid var(--line);color:var(--mut);white-space:nowrap}.t tr.hl td{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ttl{font:700 17px 'Barlow Condensed',sans-serif}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.chip{border:1px solid var(--line);border-radius:10px;padding:0 5px;margin-right:2px}
.arrow{text-align:center;color:var(--acc);font-weight:700;font-size:12px;margin:-2px 0}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}.tip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.tip h3{margin:0 0 4px;font-size:15px}.tip p{margin:0;color:var(--mut);font-size:14px}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}.note{color:var(--mut);font-size:12px;margin-top:18px}
</style></head><body>

<div class="wrap" id="app"></div>
<script>
const B=n=>`<i class="b">${n}</i>`;
const hdr=(on,x='')=>`<div class="mh"><b>East Essex Triathlon Club · Zwift TTT history</b>${x}<div class="mt">${['Latest week','Overview','Teams','Riders','Courses'].map(t=>`<span class="${t==on?'on':''}">${t}</span>`).join('')}</div></div>`;
const flt=`<div class="fl"><span class="pill">${B(1)}All years ▾</span><span class="pill">${B(2)}All coffee categories ▾</span><span class="pill">${B(3)}🔒 Load newer workbook</span></div>`;
const tbl=(h,r,hl=-1)=>`<table class="t"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map((x,i)=>`<tr class="${i==hl?'hl':''}">${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const kp=a=>`<div class="mk">${a.map(([v,l])=>`<div><b>${v}</b><small>${l}</small></div>`).join('')}</div>`;
const line=()=>`<svg viewBox="0 0 220 56" width="100%" height="56"><g fill="#1f4fff66">${[[8,38],[22,30],[36,34],[50,26],[64,31],[78,22],[92,27],[106,20],[120,24],[134,16],[148,21],[162,14],[176,18],[190,11],[206,15]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.3"/>`).join('')}</g><polyline fill="none" stroke="#d1405b" stroke-width="2" points="8,34 36,32 64,28 92,25 120,22 148,19 176,16 206,13"/></svg>`;
const bars=()=>`<svg viewBox="0 0 220 56" width="100%" height="56">${[22,34,28,44,38,50,42].map((h,i)=>`<rect x="${10+i*29}" y="${54-h}" width="20" height="${h}" rx="2" fill="${['#5fb0d9','#e0a94f','#7b4a31','#d1405b','#e0a94f','#5fb0d9','#d1405b'][i]}"/>`).join('')}</svg>`;
const cd=c=>`<span class="dot" style="background:${{F:'#5fb0d9',L:'#e0a94f',M:'#7b4a31',V:'#d1405b'}[c[0]]}"></span>${c}`;
const chips=a=>a.map(x=>`<span class="chip">${x}</span>`).join('');
const sel=t=>`<div class="mc"><span class="pill" style="font-size:12px;padding:4px 10px">${t} ▾</span> &nbsp;or click a row in the table below</div>`;
const S=[
['start','Start here: the top bar','Three controls sit at the top of every page, above the five tabs.',
 `<div class="m">${hdr('Overview',flt)}<div class="mb"><div class="mc"><h4>Everything below reacts to the two filters</h4>${line()}</div></div></div>`,
 [`${B(1)}<b>Year</b>: show one season or all years.`,`${B(2)}<b>Coffee category</b>: show only Frappe, Latte, Mocha or Vienna results. The year and category apply on every tab.`,`${B(3)}<b>Load newer workbook</b>: for the club admin. It asks for a password, then lets you add an updated Excel file.`,`The five <b>tabs</b> are always along the bottom of the black bar.`]],
['latest','1 · Latest week','The page opens here. It shows the most recent Thursday’s event: route, every team that raced, and who rode.',
 `<div class="m">${hdr('Latest week')}<div class="mb"><div class="mc">${B(1)}<span class="pill">Select an event day ▾</span> <span class="pill">Jump to latest week</span></div><div class="ttl">Latest week · 05-11-2026 · Example route</div>${kp([['6','teams'],['31','riders'],['33.2','km/h avg']])}<div class="mc">${tbl(['Team','Category','Overall','Time','Riders (total rides)'],[[`${B(2)}EETC 1`,cd('Mocha'),'12/48','41:02',`${B(3)}${chips(['Rider A · 42','Rider B · 18'])}`],['EETC 2',cd('Latte'),'20/48','42:10',chips(['Rider C · 7'])],['EETC 3',cd('Frappe'),'31/48','43:55',chips(['Rider D · 3'])]],0)}</div></div></div>`,
 [`${B(1)}Use the picker to open any past event day, or press <b>Jump to latest week</b> to come back.`,`${B(2)}Click a <b>team row</b> to open that team’s page.`,`${B(3)}Click a <b>rider name</b> to open that rider’s page. The number beside each name is how many TTTs they’ve ridden in total.`,'Scroll down for the full list of every event day. Click any row to open it.']],
['overview','2 · Overview','The club’s whole history on one page, with headline numbers and trends.',
 `<div class="m">${hdr('Overview')}<div class="mb">${kp([['640','team results'],['32.8','avg km/h'],['41','cat wins'],['118','podiums']])}<div class="row"><div class="mc"><h4>${B(1)}Average speed over time</h4>${line()}</div><div class="mc"><h4>${B(2)}Category mix</h4>${bars()}</div></div><div class="mc"><h4>${B(3)}Fastest results ever</h4>${tbl(['Date','Team','Route','km/h'],[['12-03-2026','EETC 1','Example route','39.1'],['05-02-2026','EETC 2','Example route','38.4']],0)}</div></div></div>`,
 [`${B(1)}Spot trends: dots are single results and the red line is a rolling average.`,`${B(2)}Charts show category mix, results per year, w/kg against speed, team size, start times and the most active riders.`,`${B(3)}Click any row in <b>Fastest results ever</b> to jump to that event day.`]],
['teams','3 · Teams','Compare every team, then drill into one.',
 `<div class="m">${hdr('Teams')}<div class="mb">${sel(B(1)+'Select a team…')}<div class="ttl">EETC 1</div>${kp([['52','results'],['09:31','best time'],['Top 24%','avg overall']])}<div class="row"><div class="mc"><h4>Speed over time</h4>${line()}</div><div class="mc"><h4>Finish position</h4>${line()}</div></div><div class="mc"><h4>${B(2)}Roster</h4>${tbl(['Rider','Starts','w/kg'],[['Rider A','40','3.4'],['Rider B','35','3.1']],0)}</div></div></div>`,
 [`${B(1)}Choose a team from the list, or click a row in the <b>All teams</b> table at the bottom.`,`${B(2)}The team page shows speed and finish trends, category mix, its roster and every result. Click a rider to open them.`,'Sort the All teams table by clicking any column heading.']],
['riders','4 · Riders','Everything about one rider across all their TTTs.',
 `<div class="m">${hdr('Riders')}<div class="mb">${sel(B(1)+'Select a rider…')}<div class="ttl">Rider A</div>${kp([['40','starts'],['3.4','avg wkg (zwiftpower)'],['3.9','peak wkg (zwiftpower)']])}<div class="row"><div class="mc"><h4>wkg (zwiftpower) over time</h4>${line()}</div><div class="mc"><h4>${B(2)}Most frequent teammates</h4>${bars()}</div></div><div class="mc"><h4>${B(3)}All results · by route A–Z</h4>${tbl(['Date','Team','Route','Time'],[['05-11-2026','EETC 1','Example route','41:02']],0)}</div></div></div>`,
 [`${B(1)}Pick a rider, or click a row in the <b>All riders</b> table.`,`${B(2)}See w/kg history, speed, which teams they’ve ridden for, and who they ride with most.`,`${B(3)}Every result is listed alphabetically by route. Click a column heading to re-sort, or a row to open that event day.`]],
['courses','5 · Courses','Find out who’s fastest on any route, and who rode when.',
 `<div class="m">${hdr('Courses')}<div class="mb"><div class="mc"><h4>${B(1)}All routes: click a route</h4>${tbl(['Route','Raced','Best time','Best km/h'],[['Example route A','24','38:10','41.2'],['Example route B','18','41:55','38.9']],0)}</div><div class="arrow">▼</div><div class="mc"><h4>${B(2)}Teams on this route · fastest time first</h4>${tbl(['Team','Best time','Best km/h','Avg time','Runs','Riders'],[['EETC 1','38:10','41.2','39:30','9',chips(['Rider A','Rider B'])],['EETC 2','39:42','39.6','41:05','7',chips(['Rider C','Rider D'])]],0)}</div><div class="arrow">▼</div><div class="mc"><h4>${B(3)}<span class="pill">← Back to best times</span> EETC 1 on Example route · 9 events</h4>${tbl(['Date','Overall','Time','km/h','Riders'],[['05-11-2026','12/48','38:10','41.2',chips(['Rider A 3.4','Rider B 3.1'])]])}</div></div></div>`,
 [`${B(1)}Click a <b>route</b> in the table (or use the picker).`,`${B(2)}Teams who have raced it are ranked by best time, with the riders from that best run alongside. Click a team.`,`${B(3)}You’ll see every event that team raced on that course: date, place, time, speed and the riders. Click a date row for the full event day. Press <b>← Back to best times</b> to return to the team list.`,'Each route has its own address, for example <code>#courses-figure-8</code>.']],
];
$=s=>document.querySelector(s);
$('#toc').innerHTML=S.map(s=>`<a href="#${s[0]}">${s[1].replace(/^\d · /,'')}</a>`).join('')+'<a href="#tips">Tips</a>';
$('#app').innerHTML=S.map(s=>`<section class="sec" id="${s[0]}">${s[3]}<div><h2>${s[1]}</h2><p class="lead">${s[2]}</p><ol>${s[4].map(x=>`<li>${x}</li>`).join('')}</ol></div></section>`).join('')
+`<section id="tips" style="padding-top:34px"><h2>Handy tips</h2><div class="tips">
<div class="tip"><h3>Sort any table</h3><p>Click a column heading. Click it again to reverse the order. The small arrow shows the direction.</p></div>
<div class="tip"><h3>Click almost anything</h3><p>Rows, team names and rider names are all links. The browser’s back button takes you back a step.</p></div>
<div class="tip"><h3>What does “top %” mean?</h3><p>A team’s overall place divided by the number of teams. “Top 10%” is a great finish, so <b>lower is better</b>.</p></div>
<div class="tip"><h3>Coffee categories</h3><p><span class="dot" style="background:#5fb0d9"></span>Frappe &nbsp;<span class="dot" style="background:#e0a94f"></span>Latte &nbsp;<span class="dot" style="background:#7b4a31"></span>Mocha &nbsp;<span class="dot" style="background:#d1405b"></span>Vienna. The same colours are used in every chart.</p></div>
<div class="tip"><h3>Dates</h3><p>All dates are shown as dd-mm-yyyy, for example 05-11-2026.</p></div>
<div class="tip"><h3>Share a direct link</h3><p>Add one of these to the end of the dashboard address: <code>#latest-week</code> <code>#overview</code> <code>#teams</code> <code>#riders</code> <code>#courses</code> or <code>#courses-figure-8</code>.</p></div>
</div><p class="note">Screens in this guide are simplified illustrations with example values. Your dashboard shows the real club data.</p></section>`;
</script></body></html>
